stages: [test, release]

default:
  image: node:20-alpine

test:
  stage: test
  script:
    - node scripts/validate-skill.mjs
    - node --test scripts/
    - node scripts/lint-pl.mjs --text "test" --json

# Release na tag v<wersja>: buduje redaktor-<wersja>.skill i .zip, wrzuca je do
# rejestru pakietów (generic) i tworzy Release z linkami do pobrania.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl zip
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - grep -q "version:\ *\"\?${VERSION}\"\?" SKILL.md || { echo "Tag $CI_COMMIT_TAG nie zgadza się z metadata.version w SKILL.md"; exit 1; }
    - scripts/package.sh dist
    - PKG="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/redaktor/${VERSION}"
    - |
      for f in redaktor-${VERSION}.skill redaktor-${VERSION}.zip redaktor-${VERSION}.sha256; do
        curl --fail -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/$f" "${PKG}/$f" > /dev/null
      done
    - |
      NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)
      node -e '
        const [ver, pkg, notes] = process.argv.slice(1);
        const links = ["skill", "zip", "sha256"].map(ext => ({
          name: `redaktor-${ver}.${ext}`, url: `${pkg}/redaktor-${ver}.${ext}`, link_type: "package" }));
        process.stdout.write(JSON.stringify({ tag_name: `v${ver}`, name: `redaktor ${ver}`, description: notes, assets: { links } }));
      ' "$VERSION" "$PKG" "$NOTES" > release.json
    - |
      curl --fail -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" -H "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" > /dev/null
    - echo "Release v${VERSION} utworzony"
  artifacts:
    paths: [dist/]
    expire_in: 1 week
